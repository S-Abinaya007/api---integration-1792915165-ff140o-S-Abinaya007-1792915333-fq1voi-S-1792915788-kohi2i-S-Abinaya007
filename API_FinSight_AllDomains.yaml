openapi: 3.0.3
info:
  title: FinSight Destination API - Project 1B
  version: 1.0.0
  description: >-
    Illustrative contract for the Zetheta Project 1B simulation. Confirm actual paths, fields, auth and limits with system owners.
servers:
  - url: https://finsight-sandbox.example.in
security:
  - bearerAuth: []
paths:
  /api/v1/general-ledger:
    get:
      operationId: finsight_general_ledger
      summary: Retrieve General Ledger records
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
        - in: query
          name: cursor
          schema: {type: string}
        - in: query
          name: deltaToken
          schema: {type: string}
      responses:
        '200':
          description: Records retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  nextCursor:
                    type: string
                  nextDeltaToken:
                    type: string
        '400': {description: Invalid query or validation failure}
        '401': {description: Unauthenticated}
        '403': {description: Not authorised}
        '429': {description: Rate limited; honour Retry-After}
        '500': {description: Unexpected server error}
